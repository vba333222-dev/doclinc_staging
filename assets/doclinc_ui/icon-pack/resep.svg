<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>DokLinc Obat Resep</title>
  <desc>Two-tone mint and green medicine capsule with prescription sheet.</desc>

  <defs>
    <linearGradient id="mint-24" x1="5.2" y1="4.2" x2="18.2" y2="19.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DFF8EE"/>
      <stop offset="1" stop-color="#A7F1DC"/>
    </linearGradient>

    <linearGradient id="green-24" x1="7.0" y1="4.0" x2="17.6" y2="19.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22CC9A"/>
      <stop offset="1" stop-color="#00A651"/>
    </linearGradient>
  </defs>

  <!-- Prescription sheet -->
  <path d="M5.15 3.35
           H13.65
           C14.05 3.35 14.43 3.51 14.72 3.79
           L17.05 6.12
           C17.33 6.40 17.5 6.79 17.5 7.18
           V16.95
           C17.5 18.13 16.53 19.1 15.35 19.1
           H5.15
           C3.97 19.1 3 18.13 3 16.95
           V5.5
           C3 4.32 3.97 3.35 5.15 3.35Z"
        fill="url(#mint-24)"/>

  <!-- Fold -->
  <path d="M13.85 3.65V6.15
           C13.85 6.56 14.19 6.9 14.6 6.9
           H17.05"
        stroke="url(#green-24)"
        stroke-width="1.25"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Prescription lines -->
  <rect x="5.1" y="8.2" width="5.7" height="1.15" rx="0.575" fill="#22CC9A"/>
  <rect x="5.1" y="10.85" width="7.4" height="1.05" rx="0.525" fill="#A7F1DC"/>
  <rect x="5.1" y="13.3" width="5.2" height="1.05" rx="0.525" fill="#22CC9A"/>

  <!-- Capsule -->
  <g transform="rotate(-38 15.6 15.6)">
    <rect x="12.15" y="12.0" width="7.3" height="4.85" rx="2.425"
          fill="url(#green-24)"/>
    <path d="M15.80 12.0H17.03
             C18.36 12.0 19.45 13.09 19.45 14.42
             C19.45 15.76 18.36 16.85 17.03 16.85
             H15.80V12.0Z"
          fill="url(#mint-24)"/>
    <path d="M15.8 12.25V16.6"
          stroke="#DFF8EE"
          stroke-width="0.72"
          stroke-linecap="round"/>
  </g>

  <!-- Small medical cue -->
  <path d="M6.3 5.15H7.5V6.15H8.5V7.35H7.5V8.35H6.3V7.35H5.3V6.15H6.3V5.15Z"
        fill="#00A651"/>
</svg>