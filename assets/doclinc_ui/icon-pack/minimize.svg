<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>DokLinc Minimize</title>
  <desc>Two-tone mint and green minimize icon with rounded window and collapse chevron.</desc>

  <defs>
    <linearGradient id="mint-24" x1="4.4" y1="4.4" x2="19.2" y2="19.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DFF8EE"/>
      <stop offset="1" stop-color="#A7F1DC"/>
    </linearGradient>

    <linearGradient id="green-24" x1="7.2" y1="7.2" x2="16.8" y2="16.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22CC9A"/>
      <stop offset="1" stop-color="#00A651"/>
    </linearGradient>
  </defs>

  <!-- Rounded window -->
  <rect x="3.8" y="4.0" width="16.4" height="16.0" rx="3.0"
        fill="url(#mint-24)"/>

  <!-- Top bar -->
  <rect x="5.4" y="5.7" width="13.2" height="1.35" rx="0.675"
        fill="url(#green-24)"/>

  <!-- Collapse chevron -->
  <path d="M8.0 10.2L12 14.2L16 10.2"
        stroke="url(#green-24)"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Bottom minimize line -->
  <rect x="8.25" y="16.0" width="7.5" height="1.55" rx="0.775"
        fill="url(#green-24)"/>
</svg>