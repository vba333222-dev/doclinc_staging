<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>DokLinc Video Call</title>
  <desc>Two-tone mint and green rounded video camera icon for DokLinc.</desc>

  <defs>
    <linearGradient id="mint-24" x1="5.0" y1="5.2" x2="16.5" y2="18.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DFF8EE"/>
      <stop offset="1" stop-color="#A7F1DC"/>
    </linearGradient>

    <linearGradient id="green-24" x1="10.5" y1="6.2" x2="20.0" y2="17.7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22CC9A"/>
      <stop offset="1" stop-color="#00A651"/>
    </linearGradient>
  </defs>

  <!-- camera body -->
  <rect x="3.4" y="6.2" width="12.4" height="11.6" rx="2.6"
        fill="url(#mint-24)"/>

  <!-- inner lens cue -->
  <circle cx="9.6" cy="12" r="2.45" fill="url(#green-24)"/>
  <circle cx="9.6" cy="12" r="1.25" fill="#DFF8EE"/>

  <!-- camera direction head -->
  <path d="M16.1 9.25
           L19.55 7.15
           C20.08 6.83 20.75 7.21 20.75 7.83
           V16.17
           C20.75 16.79 20.08 17.17 19.55 16.85
           L16.1 14.75
           V9.25Z"
        fill="url(#green-24)"/>

  <!-- subtle top detail -->
  <rect x="5.45" y="5.2" width="4.4" height="1.35" rx="0.675"
        fill="#22CC9A"/>
</svg>