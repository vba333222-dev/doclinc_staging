# Virtual host harness lokal.
#
# DocumentRoot adalah AKAR REPO, bukan `admin_menu/`, supaya tata letaknya sama
# dengan produksi: panel disajikan dari `/admin_menu/` dan token desain dari
# `/assets/css/doclinc-reference-ui.css`. `commons/header.php` memuat token itu
# lewat `base_url('../assets/...')`; bila DocumentRoot diarahkan langsung ke
# `admin_menu/`, permintaan tersebut keluar dari docroot, diteruskan ke
# CodeIgniter, dan dijawab halaman login HTTP 200 berbadan HTML. Akibatnya
# seluruh `var(--dl-ref-*)` tidak terdefinisi dan tangkapan layar lokal tidak
# lagi mewakili staging.
#
# Dua permukaan disajikan dari satu docroot:
#
#   /            -> portal warga & nakes (CodeIgniter di `application/`)
#   /admin_menu/ -> panel admin (CodeIgniter di `admin_menu/`)
#
# Portal memakai konfigurasi dan skema database sendiri (`DB_*`, bukan
# `ADMIN_DB_*`). Variabelnya disediakan `docker-compose.yml`, dan kolom tabel
# yang belum dibuat `bootstrap.php` dilengkapi
# `tools/local_stack/fixture_portal.php` - tanpa itu halaman nakes menjawab
# HTTP 500 tanpa badan dan terlihat seolah harnessnya rusak.
#
# `AllowOverride None` di akar repo menahan `.htaccess` akar yang memaksa
# pengalihan ke HTTPS - pengalihan itu akan menjebak setiap permintaan lokal
# dalam perulangan. Karena itu rute portal diterjemahkan di sini, dengan aturan
# yang sama seperti produksi (`!-f`/`!-d`). `AllowOverride All` di
# `admin_menu/` tetap diperlukan: di situlah `RewriteRule` menerjemahkan URL
# bersih (`/admin_menu/home`) menjadi `index.php/home`.
<VirtualHost *:80>
	DocumentRoot /var/www/html

	# `/admin_menu/...` diteruskan apa adanya supaya `.htaccess` milik panel
	# yang mengurusnya. Tanpa pengecualian ini, `/admin_menu/home` akan
	# diterjemahkan ke `index.php/admin_menu/home` milik portal dan dijawab 404.
	RewriteEngine On
	RewriteRule ^/admin_menu(/|$) - [L]

	# Rute bersih portal: `/login`, `/login-nakes`, `/home`, `/home_nakes`, ...
	# Berkas yang benar-benar ada (aset, GeoJSON, unggahan) tidak disentuh.
	#
	# `%{DOCUMENT_ROOT}%{REQUEST_URI}` dipakai, bukan `%{REQUEST_FILENAME}`:
	# di konteks <VirtualHost> nama berkas belum tentu sudah dipetakan, dan
	# kondisi `-d` lalu diuji terhadap path mentah - `/home` dianggap direktori
	# karena kontainer punya `/home`, sehingga permintaan portal tidak pernah
	# sampai ke index.php.
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
	RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
	RewriteRule ^/(.*)$ /index.php/$1 [L,QSA]

	<Directory /var/www/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	<Directory /var/www/html/admin_menu>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Berkas unggahan warga tidak boleh dieksekusi sebagai skrip; ini meniru
	# pengaturan produksi dan mencegah pratinjau lokal menyesatkan.
	<Directory /var/www/html/admin_menu/uploads>
		php_flag engine off
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
