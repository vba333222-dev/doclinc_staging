services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root_test_only
      MARIADB_DATABASE: doclinc_visit_test
      MARIADB_USER: doclinc_test
      MARIADB_PASSWORD: doclinc_test_only
    ports:
      - "127.0.0.1:33317:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
